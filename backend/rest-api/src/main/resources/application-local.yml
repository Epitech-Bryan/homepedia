spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/homepedia
    username: homepedia
    password: homepedia
  data:
    mongodb:
      uri: mongodb://localhost:27017/homepedia
    redis:
      url: redis://localhost:6379

homepedia:
  tiles:
    # Local dev usually doesn't have tippecanoe installed and doesn't care
    # about regenerating tiles — point the served file at a local path and
    # let the builder stay off.
    builder:
      enabled: false
  dvf:
    zip-path:
  dpe:
    import-enabled: false
    csv-path:
  health:
    import-enabled: false
    csv-path:
  insee:
    import-enabled: false
  geo:
    import-enabled: false
  import:
    reviews:
      enabled: false

logging:
  level:
    com.homepedia: DEBUG

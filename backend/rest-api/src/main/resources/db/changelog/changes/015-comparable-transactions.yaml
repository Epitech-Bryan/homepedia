databaseChangeLog:
  - changeSet:
      id: 015-comparable-transactions
      author: homepedia
      comment: >
        Pre-computed nearest-comparable lookups for each geocoded DVF
        transaction. Populated by a future Spark clustering job that groups
        by (property_type, surface bucket, mutation year, lat/lon
        proximity) and keeps the top-10 comparables per transaction.

        Stored as a flat (transaction_id, similarity_rank) table so the
        endpoint can do a single primary-key range scan to render the
        "similar sales" panel on the marker popup. distance_m and
        price_delta_pct cached so the popup doesn't recompute them per
        comparable on every fetch.

        Empty until the ComparableSalesAggregator job is written (issue #11).
        The table is created now so the endpoint can be wired against the
        final contract and a future deploy doesn't need a schema migration.
      changes:
        - createTable:
            tableName: comparable_transactions
            columns:
              - column:
                  name: transaction_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: similarity_rank
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: comparable_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: distance_m
                  type: INT
              - column:
                  name: price_delta_pct
                  type: NUMERIC(6,3)
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: comparable_transactions
            columnNames: transaction_id, similarity_rank
            constraintName: pk_comparable_transactions
        # similarity_rank stays 1..10 — guards a future bug that would
        # silently inflate the popup list.
        - sql:
            sql: |
              ALTER TABLE comparable_transactions
                ADD CONSTRAINT ck_comparable_rank CHECK (similarity_rank BETWEEN 1 AND 10);
        - createIndex:
            tableName: comparable_transactions
            indexName: idx_comparable_comparable_id
            columns:
              - column:
                  name: comparable_id
      rollback:
        - dropTable:
            tableName: comparable_transactions

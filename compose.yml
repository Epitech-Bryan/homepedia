services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8090:8080"   # Dashboard Traefik → http://localhost:8090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile.dev
    volumes:
      - ./webapp:/webapp
      - /webapp/node_modules
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.webapp.rule=Host(`homepedia.localhost`)
      - traefik.http.routers.webapp.entrypoints=web
      - traefik.http.routers.webapp.priority=1
      - traefik.http.services.webapp.loadbalancer.server.port=5173
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: rest-api/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/homepedia
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-homepedia}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-homepedia}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/homepedia
      - SPRING_DATA_REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - mongo
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`homepedia.localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.routers.backend.priority=2
      - traefik.http.middlewares.backend-strip.stripprefix.prefixes=/api
      - traefik.http.routers.backend.middlewares=backend-strip
      - traefik.http.services.backend.loadbalancer.server.port=8080
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=homepedia
      - POSTGRES_USER=${DB_USERNAME:-homepedia}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-homepedia}
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  spark-dvf-aggregate:
    build:
      context: ./backend
      dockerfile: spark-jobs/Dockerfile
    profiles: ["spark"]
    depends_on:
      - db
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - local[*]
      - --driver-memory
      - 2g
      - --class
      - com.homepedia.spark.DvfAggregateJob
      - local:///opt/spark/jars/homepedia-spark-jobs.jar
      - --jdbc-url
      - jdbc:postgresql://db:5432/homepedia
      - --jdbc-user
      - ${DB_USERNAME:-homepedia}
      - --jdbc-password
      - ${DB_PASSWORD:-homepedia}
    restart: "no"

volumes:
  postgres-data:
  mongo-data:
  redis-data:

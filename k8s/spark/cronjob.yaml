apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-dvf-aggregate
  namespace: homepedia
  labels:
    app.kubernetes.io/name: spark-dvf-aggregate
    app.kubernetes.io/part-of: homepedia
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: spark-dvf-aggregate
            app.kubernetes.io/part-of: homepedia
        spec:
          restartPolicy: Never
          containers:
            - name: spark-dvf-aggregate
              image: ghcr.io/epitech-bryan/homepedia-spark-jobs:latest
              env:
                - name: JDBC_URL
                  valueFrom:
                    secretKeyRef:
                      name: homepedia-db
                      key: jdbc-url
                - name: JDBC_USER
                  valueFrom:
                    secretKeyRef:
                      name: homepedia-db
                      key: username
                - name: JDBC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: homepedia-db
                      key: password
              command:
                - /opt/spark/bin/spark-submit
              args:
                - --master
                - local[*]
                - --driver-memory
                - 2g
                - --class
                - com.homepedia.spark.DvfAggregateJob
                - local:///opt/spark/jars/homepedia-spark-jobs.jar
                - --jdbc-url
                - $(JDBC_URL)
                - --jdbc-user
                - $(JDBC_USER)
                - --jdbc-password
                - $(JDBC_PASSWORD)
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 3Gi

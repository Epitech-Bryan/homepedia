apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepedia-spark-launcher
  namespace: homepedia
  labels:
    app.kubernetes.io/name: homepedia-spark-launcher
    app.kubernetes.io/part-of: homepedia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-job-launcher
  namespace: homepedia
  labels:
    app.kubernetes.io/name: homepedia-spark-launcher
    app.kubernetes.io/part-of: homepedia
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-job-launcher
  namespace: homepedia
  labels:
    app.kubernetes.io/name: homepedia-spark-launcher
    app.kubernetes.io/part-of: homepedia
subjects:
  - kind: ServiceAccount
    name: homepedia-spark-launcher
    namespace: homepedia
roleRef:
  kind: Role
  name: spark-job-launcher
  apiGroup: rbac.authorization.k8s.io
